<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Logo (clock with distributed nodes) -->
  <g transform="translate(100, 180)">
    <circle cx="135" cy="135" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="8"/>
    <circle cx="135" cy="135" r="100" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.5"/>
    
    <!-- Hour marks -->
    <g stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="135" y1="30" x2="135" y2="50"/>
      <line x1="135" y1="220" x2="135" y2="240"/>
      <line x1="30" y1="135" x2="50" y2="135"/>
      <line x1="220" y1="135" x2="240" y2="135"/>
    </g>
    
    <!-- Clock hands -->
    <g stroke="url(#accentGrad)" stroke-linecap="round">
      <line x1="135" y1="135" x2="135" y2="70" stroke-width="8"/>
      <line x1="135" y1="135" x2="185" y2="100" stroke-width="6"/>
    </g>
    
    <!-- Center dot -->
    <circle cx="135" cy="135" r="10" fill="url(#accentGrad)"/>
    
    <!-- Distributed nodes -->
    <circle cx="60" cy="240" r="16" fill="url(#accentGrad)" opacity="0.9"/>
    <circle cx="210" cy="240" r="16" fill="url(#accentGrad)" opacity="0.9"/>
    <circle cx="135" cy="280" r="12" fill="url(#accentGrad)" opacity="0.7"/>
    
    <!-- Connection lines -->
    <g stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="8,4">
      <line x1="135" y1="135" x2="60" y2="240"/>
      <line x1="135" y1="135" x2="210" y2="240"/>
      <line x1="60" y1="240" x2="210" y2="240"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="450" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="bold" fill="#ffffff">Chronos</text>
  
  <!-- Tagline -->
  <text x="450" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#94a3b8">Distributed Cron System</text>
  
  <!-- Features -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b">
    <text x="450" y="420">✓ Zero dependencies</text>
    <text x="700" y="420">✓ High availability</text>
    <text x="450" y="460">✓ At-least-once execution</text>
    <text x="700" y="460">✓ Sub-second failover</text>
  </g>
  
  <!-- URL -->
  <text x="450" y="540" font-family="monospace" font-size="28" fill="url(#accentGrad)">github.com/chronos/chronos</text>
  
  <!-- Version badge -->
  <g transform="translate(1000, 50)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="url(#accentGrad)" opacity="0.2"/>
    <rect x="2" y="2" width="116" height="32" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
    <text x="60" y="25" font-family="system-ui, sans-serif" font-size="16" fill="#818cf8" text-anchor="middle">v1.0</text>
  </g>
</svg>
